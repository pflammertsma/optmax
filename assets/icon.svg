<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-g" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
  </defs>
  <!-- Outer Segmented Ring representing Portfolio Allocation -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="url(#logo-g)" stroke-width="8" stroke-dasharray="160 40" stroke-linecap="round"/>
  <!-- Inner Rising Weight/Rebalancing Bars with Glassmorphic Opacity -->
  <rect x="36" y="52" width="6" height="12" rx="3" fill="#fff" opacity="0.6"/>
  <rect x="47" y="44" width="6" height="20" rx="3" fill="#fff" opacity="0.8"/>
  <rect x="58" y="30" width="6" height="34" rx="3" fill="#fff"/>
  <!-- Curved Ascending Trend Arrow -->
  <path d="M 30 50 Q 48 38 62 18" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <polygon points="12,0 -7,-12 -7,12" fill="#00f0ff" transform="translate(62, 18) rotate(-55)"/>
</svg>
